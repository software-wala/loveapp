<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do You Love Me? 💕</title>
  <meta name="description" content="A sweet love message just for you 💖" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- SVG heart clip shape (hidden, referenced by CSS) -->
  <svg width="0" height="0" style="position:absolute;overflow:hidden">
    <defs>
      <clipPath id="heartClip" clipPathUnits="objectBoundingBox">
        <path d="M0.5,0.88
          C0.22,0.68 0,0.52 0,0.3
          C0,0.14 0.13,0 0.28,0
          C0.37,0 0.45,0.05 0.5,0.12
          C0.55,0.05 0.63,0 0.72,0
          C0.87,0 1,0.14 1,0.3
          C1,0.52 0.78,0.68 0.5,0.88Z"/>
      </clipPath>
    </defs>
  </svg>

  <div class="bg-hearts" id="bgHearts"></div>
  <div class="confetti-container" id="confettiContainer"></div>
  <div class="sparkle-container" id="sparkleContainer"></div>

  <!-- ── Floating heart photo (side) ── -->
  <div class="heart-photo-wrap" id="heartPhotoWrap">
    <div class="heart-glow-ring"></div>
    <img src="shi.png" alt="Shishir" class="heart-photo-img" />
    <div class="heart-sparkles" id="heartSparkles"></div>
  </div>

  <!-- ══════════════ MAIN CARD ══════════════ -->
  <div class="card" id="mainCard">
    <div class="card-top-emoji">💖</div>
    <h1 class="question">Do you love me? 💕</h1>
    <p class="sub-text">Think carefully before you answer… 😘</p>

    <div class="btn-group">
      <button class="btn yes-btn" id="yesBtn" onclick="onYes()">Yes 💗</button>
      <button class="btn no-btn"  id="noBtn">No 🙅</button>
    </div>

    <p class="no-counter" id="noCounter"></p>
  </div>

  <!-- ══════════════ CELEBRATION SCREEN ══════════════ -->
  <div class="celebrate-screen" id="celebrateScreen">

    <div class="heart-ring">
      <span class="orbit-heart" style="--i:0">💖</span>
      <span class="orbit-heart" style="--i:1">💗</span>
      <span class="orbit-heart" style="--i:2">💞</span>
      <span class="orbit-heart" style="--i:3">💓</span>
      <span class="orbit-heart" style="--i:4">💝</span>
      <span class="orbit-heart" style="--i:5">💕</span>
      <span class="orbit-heart" style="--i:6">❤️</span>
      <span class="orbit-heart" style="--i:7">🩷</span>
    </div>

    <!-- Heart photo in celebration too, centred -->
    <div class="celeb-heart-wrap">
      <div class="celeb-glow-ring"></div>
      <img src="shi.png" alt="Shishir" class="celeb-heart-img" />
    </div>

    <h1 class="celebrate-title">Yay!! I knew it! 🎉</h1>

    <div class="love-words">
      <span class="word w1">You</span>
      <span class="word w2">just</span>
      <span class="word w3">made</span>
      <span class="word w4">my</span>
      <span class="word w5">whole</span>
      <span class="word w6">world</span>
      <span class="word w7">✨</span>
    </div>

    <p class="celebrate-msg" id="msg1">I promise to love you more every single day. 💌</p>
    <p class="celebrate-msg small" id="msg2">Forever & always — just you and me. 🌙🌟</p>

    <div class="mini-floats" id="miniFloats"></div>
    <button class="btn restart-btn" onclick="restart()">Go Back 🔙</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
